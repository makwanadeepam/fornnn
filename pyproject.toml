[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fornnn"
version = "0.1.0"
description = "Terminal-based forensic file manager inspired by nnn"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Deepam", email = "deepam@example.com"},
]
dependencies = [
    "textual>=0.50.0",
    "typer>=0.9.0",
    "pytsk3>=20210514",
    "libewf-python>=20201201",
    "python-magic>=0.4.27",
    "yara-python>=4.5.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
]

[project.scripts]
fornnn = "fornnn.__main__:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["fornnn*"]
